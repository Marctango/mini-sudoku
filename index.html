<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Sudoku 6×6 – Speed Trainer</title>
  <style>
    :root{
      --bg:#0b0f17; --panel:#11182a; --panel2:#0f1524;
      --text:#e8eefc; --muted:#9fb0d0;
      --accent:#7aa2ff; --bad:#ff6b6b; --good:#43d19e;
      --line:#25324f;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:linear-gradient(180deg,#070a12, #0b1020 60%, #070a12);
      color:var(--text);
      min-height:100vh;
      display:flex; justify-content:center; align-items:flex-start;
      padding:24px;
    }
    .app{
      width:min(920px, 100%);
      display:grid;
      grid-template-columns: 380px 1fr;
      gap:18px;
    }
    @media (max-width: 860px){
      .app{grid-template-columns:1fr}
    }
    .card{
      background:linear-gradient(180deg,var(--panel), var(--panel2));
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      padding:16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
    }
    h1{margin:0 0 6px; font-size:18px}
    .sub{margin:0 0 14px; color:var(--muted); font-size:13px; line-height:1.35}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    button{
      cursor:pointer;
      background:rgba(122,162,255,.16);
      color:var(--text);
      border:1px solid rgba(122,162,255,.35);
      padding:10px 12px;
      border-radius:12px;
      font-weight:600;
      transition:transform .05s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    button:hover{background:rgba(122,162,255,.22); border-color:rgba(122,162,255,.6)}
    button:active{transform:translateY(1px)}
    button.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
    button.secondary:hover{background:rgba(255,255,255,.10)}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      padding:8px 10px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
    }
    .pill strong{color:var(--text); font-weight:700}
    .kpis{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
    .hr{height:1px; background:rgba(255,255,255,.08); margin:14px 0}
    .note{font-size:12px; color:var(--muted); line-height:1.45}
    .gridWrap{display:flex; justify-content:center; align-items:center}
    .grid{
      display:grid;
      grid-template-columns: repeat(6, 52px);
      grid-template-rows: repeat(6, 52px);
      gap:0;
      border:2px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:rgba(255,255,255,.03);
    }
    .cell{
      width:52px; height:52px;
      border:1px solid rgba(255,255,255,.08);
      display:flex; justify-content:center; align-items:center;
      position:relative;
    }
    /* dikke lijnen voor 2×3 subblokken */
    .cell.block-right{border-right:2px solid var(--line)}
    .cell.block-bottom{border-bottom:2px solid var(--line)}
    .given{
      font-size:20px;
      font-weight:800;
      color:var(--text);
      opacity:.95;
    }
    input{
      width:100%; height:100%;
      background:transparent;
      border:0;
      color:var(--text);
      font-size:20px;
      font-weight:700;
      text-align:center;
      outline:none;
    }
    .bad{background:rgba(255,107,107,.14)}
    .goodflash{animation:flash .5s ease}
    @keyframes flash{
      0%{background:rgba(67,209,158,.25)}
      100%{background:transparent}
    }
    .status{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
      min-height:44px;
    }
    .status b{color:var(--text)}
    .status .ok{color:var(--good); font-weight:800}
    .status .err{color:var(--bad); font-weight:800}
    .tiny{font-size:12px; color:var(--muted)}
    .rightColTop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
    .rightColTop .row{justify-content:flex-end}
    .timer{
      font-variant-numeric: tabular-nums;
      font-size:22px;
      font-weight:900;
      letter-spacing:.3px;
    }
